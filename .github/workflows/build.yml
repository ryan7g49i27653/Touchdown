name: Build

# Verifies the driver compiles and bundles on a clean machine.
#
# This fork publishes nothing, so there is no release job and no signing
# identity in CI -- the build here is ad-hoc signed, which is also what
# build.sh does by default.

# `local` is the fork's working branch and the only one that carries this
# fork's code; `main` is pure upstream. Without `local` here the workflow
# never ran against anything that was actually changed, which is how it sat
# for months asserting things about a branch nobody commits to.
on:
  push:
    branches: [main, local]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          sw_vers

      # Before the build: a compile failure in the driver surfaces here too,
      # and a mapping regression is worth catching before anything is signed.
      - name: Tests
        run: ./run_tests.sh

      - name: Build (ad-hoc signed)
        env:
          SIGN_IDENTITY: "-"
        run: |
          mkdir -p ci-out
          ./build.sh ci-out

      - name: Verify bundle
        run: |
          APP=ci-out/Touchdown.app
          test -x "$APP/Contents/MacOS/Touchdown"
          test -f "$APP/Contents/Resources/Touchdown.icns"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --strict "$APP"
          # Nothing may link against a framework any more: the bundle embeds
          # none, so an @rpath reference would be a dyld error at launch.
          ! otool -L "$APP/Contents/MacOS/Touchdown" | grep -q '@rpath/'
          test ! -d "$APP/Contents/Frameworks"
          # The deployment target is pinned, so it must not track the runner's
          # OS. Catching this here is the point -- it is invisible until the
          # app is run on an older machine.
          vtool -show-build "$APP/Contents/MacOS/Touchdown" | grep -q 'minos 11.0'
          echo "✅ bundle layout, signature, linkage and deployment target verified"

      - name: Build analyzer
        run: |
          swiftc HIDAnalyzer.swift -o ci-out/HIDAnalyzer \
            -framework IOKit -framework CoreFoundation -O

      - name: Shellcheck scripts
        run: |
          for f in build.sh install.sh uninstall.sh version.sh run_tests.sh \
                   run_driver.sh run_analyzer.sh; do
            bash -n "$f" && echo "OK $f"
          done
